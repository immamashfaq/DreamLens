version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dreamlens_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dreamlens_network

  backend:
    build:
      context: ./dreamlens-backend
      dockerfile: Dockerfile
    container_name: dreamlens_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
    networks:
      - dreamlens_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dreamlens_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - backend
    networks:
      - dreamlens_network

volumes:
  mongo_data:

networks:
  dreamlens_network:
    driver: bridge
